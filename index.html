<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nipper Hub</title>
  <meta name="description" content="Nippers helper: preliminary evaluation sign-offs, attendance, water safety ratios and beach games.">

  <!-- Installable web app (Add to Home Screen) -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#E2231A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nipper Hub">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div id="app"><div class="boot"><img src="icons/icon-192.png" alt="" width="72" height="72"><div>Nipper Hub</div></div></div>
  <div id="toast-root" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/standards.js"></script>
  <script src="js/games.js"></script>
  <script src="js/parent-notes.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Offline support: cache the app so it opens with no reception at the beach.
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').then(reg => reg.update()).catch(() => {});
      });
      // When a new version of the app installs, reload once so it shows straight away.
      if (navigator.serviceWorker.controller) {
        let reloaded = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => { if (!reloaded) { reloaded = true; location.reload(); } });
      }
    }
  </script>
</body>
</html>
